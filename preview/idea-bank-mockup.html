<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>idea-bank — 아이디어뱅크 목업</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050508;
        --sidebar: #0c0c12;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f0f0f5;
        --muted: #9a9aa8;
        --green: #10b981;
        --accent: #e8a930;
        --cat-work: #5b9fd4;
        --cat-study: #a78bfa;
        --cat-hobby: #6ee7b7;
        --cat-ideas: #fbbf24;
        --font: "IBM Plex Sans", system-ui, sans-serif;
        --font-display: "Sora", var(--font);
        --sidebar-w: 220px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); }
      .mock-banner {
        padding: 0.5rem 1rem; text-align: center; font-size: 0.8125rem; color: var(--muted);
        background: rgba(251, 191, 36, 0.1); border-bottom: 1px solid var(--border);
      }
      .mock-banner strong { color: var(--cat-ideas); }
      .mock-banner a { color: var(--accent); margin: 0 0.35rem; }
      .app-shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: calc(100dvh - 36px); }
      .sidebar {
        display: flex; flex-direction: column; padding: 1rem 0.75rem; background: var(--sidebar);
        border-right: 1px solid rgba(251, 191, 36, 0.15);
      }
      .logo-block h1 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; }
      .logo-block p { margin: 0.3rem 0 0.85rem; font-size: 0.75rem; color: var(--muted); }
      .nav-item {
        display: block; width: 100%; margin: 0.15rem 0; padding: 0.55rem 0.65rem; font: inherit; font-size: 0.875rem;
        text-align: left; color: var(--muted); background: transparent; border: 1px solid transparent;
        border-radius: 8px; cursor: pointer;
      }
      .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
      .nav-item.is-active { color: var(--text); background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.35); }
      .sidebar-note { margin-top: auto; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
      .main { display: flex; flex-direction: column; min-width: 0; }
      .toolbar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem;
        border-bottom: 1px solid var(--border); background: rgba(5,5,8,0.6);
      }
      .toolbar input {
        flex: 1; min-width: 8rem; max-width: 16rem; padding: 0.45rem 0.65rem; font: inherit; font-size: 0.875rem;
        color: var(--text); background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 8px;
      }
      .toolbar .btn {
        padding: 0.45rem 0.75rem; font: inherit; font-size: 0.8125rem; color: var(--muted);
        background: transparent; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
      }
      .toolbar .btn:hover { color: var(--text); }
      .toolbar .btn--primary { color: #050508; background: var(--cat-ideas); border-color: var(--cat-ideas); }
      .cat-filter {
        display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--border); background: rgba(251, 191, 36, 0.05);
      }
      .cat-chip {
        padding: 0.35rem 0.7rem; font: inherit; font-size: 0.75rem; color: var(--muted);
        background: transparent; border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
      }
      .cat-chip.is-active { color: var(--text); background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.45); }
      .content { flex: 1; padding: 1rem 1.25rem 2rem; overflow-y: auto; }
      .list-meta { font-size: 0.8125rem; color: var(--muted); margin: 0 0 0.75rem; }
      .idea-card {
        display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.75rem;
        padding: 0.9rem 1rem; margin-bottom: 0.65rem; border: 1px solid var(--border);
        border-radius: 12px; background: rgba(0,0,0,0.28); cursor: pointer;
      }
      .idea-card:hover { border-color: rgba(251, 191, 36, 0.35); }
      .idea-card__body { flex: 1; min-width: 12rem; }
      .idea-card__title { font-weight: 600; margin: 0 0 0.35rem; }
      .idea-card__preview { margin: 0; font-size: 0.8125rem; color: var(--muted); line-height: 1.5; }
      .idea-card__thumb {
        width: 48px; height: 48px; border-radius: 8px; background: rgba(167,139,250,0.12);
        border: 1px solid var(--border); flex-shrink: 0;
      }
      .pill-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
      .pill {
        padding: 0.15rem 0.5rem; font-size: 0.6875rem; border-radius: 999px; border: 1px solid var(--border);
      }
      .pill--work { color: var(--cat-work); border-color: var(--cat-work); }
      .pill--study { color: var(--cat-study); border-color: var(--cat-study); }
      .pill--hobby { color: var(--cat-hobby); border-color: var(--cat-hobby); }
      .pill--pin { color: var(--accent); border-color: var(--accent); }
      .sketch-form { max-width: 40rem; }
      .sketch-form h2 { margin: 0 0 1rem; font-family: var(--font-display); }
      .field-label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; }
      .field-input {
        width: 100%; padding: 0.5rem 0.65rem; margin-bottom: 1rem; font: inherit; font-size: 0.9375rem;
        color: var(--text); background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 8px;
      }
      .cat-radios { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
      .cat-radio {
        padding: 0.4rem 0.75rem; font: inherit; font-size: 0.8125rem; color: var(--muted);
        background: transparent; border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
      }
      .cat-radio.is-selected { color: var(--text); background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.45); }
      .cat-radio--work.is-selected { background: rgba(91,159,212,0.12); border-color: var(--cat-work); color: var(--cat-work); }
      .cat-radio--study.is-selected { background: rgba(167,139,250,0.12); border-color: var(--cat-study); color: var(--cat-study); }
      .cat-radio--hobby.is-selected { background: rgba(110,231,183,0.12); border-color: var(--cat-hobby); color: var(--cat-hobby); }
      .sketch-body {
        width: 100%; min-height: 8rem; padding: 0.75rem; margin-bottom: 1rem; font: inherit; line-height: 1.65;
        color: var(--text); background: rgba(0,0,0,0.28); border: 1px solid var(--border); border-radius: 12px; resize: vertical;
      }
      .img-grid { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
      .img-thumb {
        width: 72px; height: 72px; border-radius: 8px; background: rgba(167,139,250,0.12);
        border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center;
        font-size: 0.625rem; color: var(--muted);
      }
      .form-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
      @media (max-width: 720px) { .app-shell { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <p class="mock-banner">
      <strong>idea-bank 목업</strong> — targetCategory · 허브와 분리
      <a href="hub-readonly-mockup.html">허브 (3카테고리)</a>
      <a href="marathon-log-app-mockup.html">마라톤 앱</a>
    </p>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo-block">
          <h1>idea-bank</h1>
          <p>아이디어 관리</p>
        </div>
        <button type="button" class="nav-item is-active" data-view="list">전체 아이디어</button>
        <button type="button" class="nav-item" data-view="sketch">스케치 편집</button>
        <button type="button" class="nav-item" data-view="new">＋ 새 아이디어</button>
        <p class="sidebar-note">허브 링크 없음 · 북마크 접근<br>승격 전 아이디어는 허브에 미노출</p>
      </aside>
      <div class="main">
        <div class="toolbar">
          <input type="search" id="search" placeholder="제목·내용 검색…" />
          <button type="button" class="btn">JSON 내보내기</button>
          <button type="button" class="btn btn--primary" id="btn-new">＋ 새 스케치</button>
        </div>
        <nav class="cat-filter" id="cat-filter"></nav>
        <div class="content" id="content"></div>
      </div>
    </div>
    <script>
      var CAT_LABEL = { work: "업무 도우미", study: "공부·실험", hobby: "러닝·취미" };

      var IDEAS = [
        {
          id: "marathon-log",
          title: "마라톤 기록장",
          body: "Keep에 흩어진 대회 기록을 JSON으로 관리…",
          targetCategory: "hobby",
          pinned: true,
        },
        {
          id: "hub-admin",
          title: "허브 admin 모드",
          body: "catalog 편집을 Git 없이…",
          targetCategory: "work",
          pinned: false,
        },
        {
          id: "note-sync",
          title: "메모 앱 연동",
          body: "Keep export → idea-bank import…",
          targetCategory: "study",
          pinned: false,
        },
      ];

      var state = { view: "list", filter: "all", editId: "marathon-log", newCat: "study" };

      function filteredIdeas() {
        var q = (document.getElementById("search").value || "").trim().toLowerCase();
        return IDEAS.filter(function (idea) {
          if (state.filter !== "all" && idea.targetCategory !== state.filter) return false;
          if (!q) return true;
          return (
            idea.title.toLowerCase().indexOf(q) >= 0 ||
            idea.body.toLowerCase().indexOf(q) >= 0
          );
        });
      }

      function renderCatFilter() {
        var chips = [{ id: "all", label: "전체" }];
        ["work", "study", "hobby"].forEach(function (c) {
          chips.push({ id: c, label: CAT_LABEL[c] });
        });
        document.getElementById("cat-filter").innerHTML = chips
          .map(function (c) {
            return (
              '<button type="button" class="cat-chip' +
              (state.filter === c.id ? " is-active" : "") +
              '" data-filter="' + c.id + '">' + c.label + "</button>"
            );
          })
          .join("");
        document.querySelectorAll(".cat-chip").forEach(function (btn) {
          btn.onclick = function () {
            state.filter = btn.getAttribute("data-filter");
            render();
          };
        });
      }

      function renderList() {
        var ideas = filteredIdeas();
        document.getElementById("content").innerHTML =
          '<p class="list-meta">' + ideas.length + "개 · 목표 카테고리 필터</p>" +
          ideas
            .map(function (idea) {
              return (
                '<article class="idea-card" data-id="' + idea.id + '">' +
                '<div class="idea-card__body">' +
                '<p class="idea-card__title">' + idea.title + "</p>" +
                '<p class="idea-card__preview">' + idea.body + "</p>" +
                '<div class="pill-row">' +
                (idea.pinned ? '<span class="pill pill--pin">고정</span>' : "") +
                '<span class="pill pill--' + idea.targetCategory + '">' +
                CAT_LABEL[idea.targetCategory] +
                "</span></div></div>" +
                '<div class="idea-card__thumb"></div></article>'
              );
            })
            .join("");
        document.querySelectorAll(".idea-card").forEach(function (card) {
          card.onclick = function () {
            state.editId = card.getAttribute("data-id");
            state.view = "sketch";
            render();
          };
        });
      }

      function renderSketch(isNew) {
        var idea = isNew
          ? { title: "", body: "", targetCategory: state.newCat }
          : IDEAS.find(function (i) { return i.id === state.editId; }) || IDEAS[0];

        document.getElementById("content").innerHTML =
          '<div class="sketch-form">' +
          "<h2>" + (isNew ? "새 아이디어" : idea.title) + "</h2>" +
          '<label class="field-label">제목</label>' +
          '<input class="field-input" type="text" value="' + (idea.title || "") + '" placeholder="아이디어 제목" />' +
          '<span class="field-label">목표 카테고리 (허브 승격 시)</span>' +
          '<div class="cat-radios" id="cat-radios"></div>' +
          '<label class="field-label">본문 스케치</label>' +
          '<textarea class="sketch-body" placeholder="자유 형식 메모…">' +
          (idea.body || "") +
          "</textarea>" +
          '<span class="field-label">이미지 첨부</span>' +
          '<div class="img-grid">' +
          '<div class="img-thumb">screenshot</div>' +
          '<div class="img-thumb">+ 붙여넣기</div></div>' +
          '<div class="form-actions">' +
          '<button type="button" class="btn btn--primary">저장</button>' +
          '<button type="button" class="btn">JSON 내보내기</button>' +
          (isNew ? "" : '<span class="pill pill--' + idea.targetCategory + '">' + CAT_LABEL[idea.targetCategory] + "</span>") +
          "</div></div>";

        var cat = isNew ? state.newCat : idea.targetCategory;
        document.getElementById("cat-radios").innerHTML = ["work", "study", "hobby"]
          .map(function (c) {
            return (
              '<button type="button" class="cat-radio cat-radio--' + c +
              (cat === c ? " is-selected" : "") +
              '" data-cat="' + c + '">' + CAT_LABEL[c] + "</button>"
            );
          })
          .join("");
        document.querySelectorAll(".cat-radio").forEach(function (btn) {
          btn.onclick = function () {
            state.newCat = btn.getAttribute("data-cat");
            if (!isNew) {
              var item = IDEAS.find(function (i) { return i.id === state.editId; });
              if (item) item.targetCategory = state.newCat;
            }
            renderSketch(isNew);
          };
        });
      }

      function render() {
        document.querySelectorAll(".nav-item[data-view]").forEach(function (btn) {
          btn.classList.toggle("is-active", btn.getAttribute("data-view") === state.view);
        });
        renderCatFilter();
        if (state.view === "list") renderList();
        else if (state.view === "new") renderSketch(true);
        else renderSketch(false);
      }

      document.querySelectorAll(".nav-item[data-view]").forEach(function (btn) {
        btn.onclick = function () {
          state.view = btn.getAttribute("data-view");
          render();
        };
      });
      document.getElementById("btn-new").onclick = function () {
        state.view = "new";
        render();
      };
      document.getElementById("search").oninput = function () {
        if (state.view === "list") renderList();
      };

      render();
    </script>
  </body>
</html>
