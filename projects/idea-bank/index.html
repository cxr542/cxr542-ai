<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="idea-bank — 개인 아이디어 관리 (targetCategory · IndexedDB)" />
    <title>idea-bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <p class="app-banner">
      <strong>idea-bank</strong> — 허브와 분리 · 목표 카테고리 · 로컬 저장
    </p>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo-block">
          <h1>idea-bank</h1>
          <p>아이디어 관리</p>
        </div>
        <button type="button" class="nav-item is-active" data-view="list">전체 아이디어</button>
        <button type="button" class="nav-item" data-view="sketch">스케치 편집</button>
        <button type="button" class="nav-item" data-view="pinned">고정</button>
        <p class="sidebar-note">승격 전 아이디어는 cxr542-hub에 표시되지 않습니다.</p>
      </aside>
      <div class="main">
        <div class="toolbar">
          <input type="search" id="search" placeholder="제목·내용 검색…" autocomplete="off" />
          <button type="button" class="btn" id="btn-export">JSON 내보내기</button>
          <label class="btn">
            JSON 가져오기
            <input type="file" id="import-file" accept="application/json,.json" hidden />
          </label>
          <button type="button" class="btn btn--primary" id="btn-new">＋ 새 스케치</button>
        </div>
        <nav class="cat-filter" id="cat-filter"></nav>
        <div class="content" id="content"></div>
      </div>
    </div>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
