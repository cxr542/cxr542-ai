<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="idea-bank — 서비스 개발 전 떠오른 생각을 정리하는 로컬 아이디어 노트"
    />
    <title>idea-bank · 아이디어 노트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css?v=nav-count" />
  </head>
  <body>
    <p class="app-banner">
      <span class="app-banner__brand">💡 idea-bank</span>
      <span class="app-banner__tagline">서비스 만들기 전, 생각을 모아 두는 아이디어 노트</span>
      <span class="app-banner__meta">🔒 내 브라우저에만 · 🎯 준비되면 허브로</span>
    </p>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="서비스 메뉴">
        <div class="sidebar__head">
          <div class="logo-block">
            <h1><span class="logo-block__icon" aria-hidden="true">💡</span><span class="logo-block__text">idea-bank</span></h1>
            <p class="logo-block__sub">개발 전 아이디어 노트</p>
          </div>
        </div>
        <nav class="sidebar-nav" aria-label="주 메뉴">
          <button type="button" class="nav-item is-active" data-view="list" title="전체 아이디어">
            <span class="nav-item__icon" aria-hidden="true">📋</span>
            <span class="nav-item__label">전체 아이디어</span>
            <span class="nav-item__badge" id="nav-count-all" aria-label="아이디어 개수">0</span>
          </button>
          <button type="button" class="nav-item" data-view="sketch" title="아이디어 쓰기">
            <span class="nav-item__icon" aria-hidden="true">✏️</span>
            <span class="nav-item__label">아이디어 쓰기</span>
          </button>
          <button type="button" class="nav-item" data-view="pinned" title="고정함">
            <span class="nav-item__icon" aria-hidden="true">📌</span>
            <span class="nav-item__label">고정함</span>
            <span class="nav-item__badge" id="nav-count-pinned" aria-label="고정 개수">0</span>
          </button>
        </nav>
        <a class="nav-item nav-item--hub" href="../../" title="cxr542-hub로 돌아가기">
          <span class="nav-item__icon" aria-hidden="true">🏠</span>
          <span class="nav-item__label">허브로 돌아가기</span>
        </a>
        <p class="sidebar-note">
          📝 메모·구상·망상까지 OK. 다듬어지면 🚀 승격 체크리스트로 cxr542-hub에 올리세요. (승격 전엔 허브에 안
          보입니다)
        </p>
        <button
          type="button"
          class="sidebar-rail"
          id="sidebar-toggle"
          aria-expanded="true"
          aria-controls="sidebar"
          title="메뉴 접기"
        >
          <span class="sidebar-rail__label">접기</span>
          <span class="sidebar-rail__icon" aria-hidden="true">‹</span>
        </button>
      </aside>
      <div class="main">
        <div class="toolbar">
          <button
            type="button"
            class="btn sidebar-toggle-toolbar"
            id="sidebar-toggle-toolbar"
            title="메뉴 접기"
            aria-expanded="true"
          >
            ☰
          </button>
          <a class="btn btn--hub" href="../../" title="cxr542-hub로 돌아가기">← 허브</a>
          <input type="search" id="search" placeholder="🔍 아이디어 검색…" autocomplete="off" />
          <button type="button" class="btn" id="btn-export">JSON 내보내기</button>
          <label class="btn">
            JSON 가져오기
            <input type="file" id="import-file" accept="application/json,.json" hidden />
          </label>
          <button type="button" class="btn btn--primary" id="btn-new">✨ 새 아이디어</button>
        </div>
        <nav class="cat-filter" id="cat-filter"></nav>
        <div class="content" id="content"></div>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (localStorage.getItem("idea-bank-sidebar-collapsed") === "1") {
            document.documentElement.classList.add("sidebar-collapsed-boot");
          }
        } catch (e) {}
      })();
    </script>
    <script src="js/db.js?v=sidebar-3"></script>
    <script src="js/promote.js?v=sidebar-3"></script>
    <script src="js/app.js?v=sidebar-3"></script>
  </body>
</html>
