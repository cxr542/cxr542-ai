<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="idea-bank — 서비스 개발 전 떠오른 생각을 정리하는 로컬 아이디어 노트"
    />
    <title>idea-bank · 아이디어 노트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <p class="app-banner">
      <span class="app-banner__brand">💡 idea-bank</span>
      <span class="app-banner__tagline">서비스 만들기 전, 생각을 모아 두는 아이디어 노트</span>
      <span class="app-banner__meta">🔒 내 브라우저에만 · 🎯 준비되면 허브로</span>
    </p>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo-block">
          <h1>💡 idea-bank</h1>
          <p>개발 전 아이디어 노트</p>
        </div>
        <button type="button" class="nav-item is-active" data-view="list">📋 전체 아이디어</button>
        <button type="button" class="nav-item" data-view="sketch">✏️ 아이디어 쓰기</button>
        <button type="button" class="nav-item" data-view="pinned">📌 고정함</button>
        <p class="sidebar-note">
          📝 메모·구상·망상까지 OK. 다듬어지면 🚀 승격 체크리스트로 cxr542-hub에 올리세요. (승격 전엔 허브에 안
          보입니다)
        </p>
      </aside>
      <div class="main">
        <div class="toolbar">
          <input type="search" id="search" placeholder="🔍 아이디어 검색…" autocomplete="off" />
          <button type="button" class="btn" id="btn-export">JSON 내보내기</button>
          <label class="btn">
            JSON 가져오기
            <input type="file" id="import-file" accept="application/json,.json" hidden />
          </label>
          <button type="button" class="btn btn--primary" id="btn-new">✨ 새 아이디어</button>
        </div>
        <nav class="cat-filter" id="cat-filter"></nav>
        <div class="content" id="content"></div>
      </div>
    </div>
    <script src="js/db.js"></script>
    <script src="js/promote.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
